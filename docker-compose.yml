name: ticketing

services:
  mysql:
    image: mysql
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ticketing
    ports:
      - "3307:3306"
    volumes:
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword" ]
      interval: 5s
      timeout: 2s
      retries: 10

  inventory:
    build:
      context: ./services/inventory
    image: ticketing-inventory:latest
    container_name: inventory
    depends_on:
      mysql:
        condition: service_healthy
      kafka-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8080:8080"

  booking:
    build:
      context: services/booking
    image: ticketing-booking:latest
    container_name: booking
    depends_on:
      - mysql
      - kafka-broker
      - inventory
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      INVENTORY_SERVICE_URL: http://inventory:8080/api/v1/inventory
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
    ports:
      - "8081:8081"

  order:
    build:
      context: services/order
    image: ticketing-order:latest
    container_name: order
    depends_on:
      - inventory
      - booking
      - mysql
      - kafka-broker
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
      INVENTORY_SERVICE_URL: http://inventory:8080/api/v1/inventory
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-broker:29092
    ports:
      - "8082:8082"

  gateway:
    build:
      context: services/gateway
    image: ticketing-gateway:latest
    container_name: api-gateway
    depends_on:
      - inventory
      - booking
      - order
      - security
    ports:
      - "8090:8090"

  security:
    build:
      context: services/security
    image: ticketing-security:latest
    container_name: security
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ticketing
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    ports:
      - "8085:8085"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    hostname: zookeeper
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 3000

  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-broker
    ports:
      - "9092:9092"
      - "29092:29092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT, PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-broker:29092, PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8084:8080"
    depends_on:
      - kafka-broker
    environment:
      KAFKA_CLUSTER_NAME: local
      KAFKA_CLUSTERS_BOOTSTRAPSERVERS: kafka-broker:29092
      DYNAMIC_CONFIG_ENABLED: 'true'

  kafka-schema-registry:
    image: confluentinc/cp-schema-registry
    hostname: kafka-schema-registry
    container_name: kafka-schema-registry
    depends_on:
      - kafka-broker
    ports:
      - "8083:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: kafka-schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka-broker:29092'
      SCHEMA_REGISTRY_LISTENERS: http://kafka-schema-registry:8081

volumes:
  db-data:
