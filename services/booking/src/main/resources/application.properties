spring.application.name=booking
server.port=8081

spring.datasource.url=jdbc:mysql://mysql:3306/ticketing
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always

#Value used by InventoryService
inventory.service.url=http://inventory:8080/api/v1/inventory

#Kafka
spring.kafka.bootstrap-servers=kafka-broker:29092
spring.kafka.template.default-topic=booking
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer